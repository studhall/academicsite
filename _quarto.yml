project:
  type: website
  pre-render: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/sync_cv.ps1
  resources:
    - cv/Hall_CV_Current.pdf
    - data/treatment-facilities-dashboard/data/facility_dashboard_*.csv
    - data/treatment-facilities-dashboard/data/harmonization_crosswalk.csv
    - data/treatment-facilities-dashboard/data/dashboard/*.csv
    - data/treatment-facilities-dashboard/data/dashboard/*.json
    - data/moud-dashboard/downloads/*.csv.gz
    - data/moud-dashboard/data/source_anomalies.csv
    - data/moud-dashboard/data/state_population.csv
  render:
    - "*.qmd"
    - "data/**/*.qmd"
    - "posts/*/index.qmd"
    - "series/**/*.qmd"
    - "!**/scripts/**"
    - "!**/*.Rmd"
    - "!**/*.Rmarkdown"

website:
  title: "David Hall"
  site-url: https://econdavidhall.com
  description: "David Hall is an applied microeconomist studying health policy, substance use treatment, and access to care."
  navbar:
    left:
      - href: about.qmd
        text: About
      - href: research.qmd
        text: Research
      - href: teaching.qmd
        text: Teaching
      - href: data.qmd
        text: Data
      - href: posts.qmd
        text: Blog
      - href: cv.qmd
        text: CV
    right:
      - icon: github
        href: https://github.com/studhall
        target: _blank
        aria-label: GitHub
      - icon: mortarboard
        href: https://scholar.google.com/citations?user=5H5WI0AAAAAJ&hl=en
        target: _blank
        aria-label: Google Scholar
      - icon: rss
        href: posts.xml
  page-footer:
    left: "(c) 2026 David Hall"
    center: "[dhall7@uoregon.edu](mailto:dhall7@uoregon.edu)"
    right: "[Google Scholar](https://scholar.google.com/citations?user=5H5WI0AAAAAJ&hl=en) | [GitHub](https://github.com/studhall) | [X/Twitter](https://x.com/studhall) | Built with [Quarto](https://quarto.org)"

format:
  html:
    theme: pulse
    toc: true
    css: styles.css
    include-after-body:
      - includes/subscribe.html
    include-in-header:
      - includes/followit-meta.html

execute:
  freeze: auto

exclude:
  - "**/*.Rmd"
  - "scripts/**"
  - "analysis/**"
  - "series/**/data/**"
  - "posts/**/moud_year/**"
  - "posts/**/sdud_by_year/**"
  - "**/scripts/**"
  - "**/*.rds"
  - "**/*.rda"
  - "**/*.RData"

project:
  type: website
  resources:
    - cv/Hall_CV_Current.pdf
    - data/treatment-facilities-dashboard/data/facility_dashboard_*.csv
  render:
    - "*.qmd"
    - "data/**/*.qmd"
    - "posts/*/index.qmd"
    - "series/**/*.qmd"
    - "!**/scripts/**"
    - "!**/*.Rmd"
    - "!**/*.Rmarkdown"

website:
  title: "David Hall"
  site-url: https://econdavidhall.com
  description: "David Hall's academic website"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: about.qmd
        text: About
      - href: research.qmd
        text: Research
      - href: posts.qmd
        text: Blog
      - href: teaching.qmd
        text: Teaching
      - text: Data
        menu:
          - href: data.qmd
            text: Data Home
          - href: data/moud-dashboard/index.qmd
            text: MOUD Dashboard
          - href: data/treatment-facilities/index.qmd
            text: Treatment Facility Data
      - href: cv.qmd
        text: CV
    right:
      - icon: mortarboard
        href: https://scholar.google.com/citations?user=5H5WI0AAAAAJ&hl=en
        target: _blank
        aria-label: Google Scholar
      - icon: rss
        href: posts.xml
      - icon: envelope
        href: https://follow.it/david-hall?leanpub
        target: _blank
  page-footer:
    left: "(c) 2026 David Hall"
    center: "[dhall7@uoregon.edu](mailto:dhall7@uoregon.edu)"
    right: "[Google Scholar](https://scholar.google.com/citations?user=5H5WI0AAAAAJ&hl=en) | [GitHub](https://github.com/studhall) | [X/Twitter](https://x.com/studhall) | Built with [Quarto](https://quarto.org)"

format:
  html:
    theme: pulse
    toc: true
    css: styles.css
    include-after-body:
      - includes/subscribe.html
    include-in-header:
      - includes/followit-meta.html

execute:
  freeze: auto

exclude:
  - "**/*.Rmd"
  - "scripts/**"
  - "analysis/**"
  - "series/**/data/**"
  - "posts/**/moud_year/**"
  - "posts/**/sdud_by_year/**"
  - "**/scripts/**"
  - "**/*.rds"
  - "**/*.rda"
  - "**/*.RData"
